            font-size="15">LANGUAGE</text>
      <rect x="262" y="0" width="140" height="34" rx="17" fill="#E6DED2"/>
      <text x="332" y="23"
            text-anchor="middle"
            fill="#4D4943"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15">STRUCTURE</text>
    </g>
  </g>

  <g transform="translate(752 61)">
    <text x="0" y="0"
