          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="29" font-weight="680">的基本结构</text>
  </g>

  <g transform="translate(60 354)">
    <circle cx="6" cy="0" r="5" fill="#E85D3F"/>
    <text x="22" y="6"
