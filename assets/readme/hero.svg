    <text x="0" y="102"
          fill="#1F1E1B"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="88" font-weight="750">tta-tone</text>

    <text x="2" y="158"
          fill="#4D4943"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="28">让 AI 文案保持真实、平实、完整和易读</text>

    <g transform="translate(2 214)">
      <rect x="0" y="0" width="110" height="34" rx="17" fill="#1F1E1B"/>
      <text x="55" y="23"
