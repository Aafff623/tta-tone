<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">tta-tone</title>
  <desc id="desc">一份让 AI 文案保持真实、平实、完整和易读的文风 Skill，并展示标题从刻意制造文案感到直接说明内容的修改。</desc>

  <rect width="1200" height="400" rx="28" fill="#F6F2EA"/>
  <path d="M0 319H704" stroke="#D8D0C4"/>
  <path d="M704 52V348" stroke="#D8D0C4"/>

  <g transform="translate(60 54)">
